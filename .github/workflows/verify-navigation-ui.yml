name: Verify navigation UI

on:
  push:
    branches: [feat/minimap-waypoints]
    paths: [.github/workflows/verify-navigation-ui.yml]

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project
        run: npm ci

      - name: Rebuild and inspect world
        run: |
          npm run world
          npm run inspect

      - name: Build production bundle
        run: npm run build

      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production and dev servers
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4180 > /tmp/japanmap-preview.log 2>&1 &
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4179 > /tmp/japanmap-dev.log 2>&1 &
          for port in 4179 4180; do
            ready=0
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then
              cat /tmp/japanmap-preview.log /tmp/japanmap-dev.log
              exit 1
            fi
          done

      - name: Exercise production UI and navigation mechanics
        run: |
          cat > .navigation-ui.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const timeout = 120_000;
          const browser = await chromium.launch({ headless: true });

          const signature = async (locator) => locator.evaluate((canvas) => {
            const ctx = canvas.getContext('2d');
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let hash = 2166136261;
            for (let i = 0; i < data.length; i += 32) {
              hash ^= data[i] ?? 0;
              hash = Math.imul(hash, 16777619);
              hash ^= data[i + 1] ?? 0;
              hash = Math.imul(hash, 16777619);
              hash ^= data[i + 2] ?? 0;
              hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
          });

          // Production: derselbe Touch-Flow wie für einen echten Spieler, ohne Debug-Global.
          const productContext = await browser.newContext({
            viewport: { width: 390, height: 844 },
            hasTouch: true,
            isMobile: true,
          });
          const product = await productContext.newPage();
          await product.goto('http://127.0.0.1:4180/', { waitUntil: 'domcontentloaded' });
          await product.waitForFunction(
            () => document.querySelector('.start')?.dataset.phase === 'bereit',
            null,
            { timeout },
          );
          await product.locator('.start__button').click();
          await product.locator('[data-touch="drive"]').waitFor({ state: 'visible', timeout });
          await product.locator('[data-touch="drive"]').click();
          await product.waitForFunction(() => {
            const mini = document.querySelector('.navmap-mini');
            return mini && !mini.hidden && getComputedStyle(mini).display !== 'none';
          }, null, { timeout });

          await product.waitForFunction(() => Array.from(performance.getEntriesByType('resource')).some(
            (entry) => entry.name.includes('navigation-map') && entry.name.includes('.webp'),
          ), null, { timeout });

          const mini = product.locator('.navmap-mini__canvas');
          await product.waitForTimeout(250);
          const miniBeforeWaypoint = await signature(mini);

          await product.keyboard.press('m');
          await product.waitForFunction(() => {
            const map = document.querySelector('.navmap');
            return map && !map.hidden && getComputedStyle(map).display !== 'none';
          }, null, { timeout });

          assert.ok(await product.locator('.navmap-poi').count() >= 7, 'SVG-POIs fehlen auf der Vollkarte');
          assert.equal(
            await product.locator('.navmap__poiLayer').evaluate((node) => getComputedStyle(node).pointerEvents),
            'none',
            'POI-Layer darf Kartenklicks nicht abfangen',
          );

          const full = product.locator('.navmap__canvas');
          const box = await full.boundingBox();
          assert.ok(box && box.width > 100 && box.height > 100, 'Karten-Canvas hat keine nutzbare Fläche');
          await full.dispatchEvent('pointerup', {
            button: 0,
            pointerId: 11,
            pointerType: 'touch',
            clientX: box.x + box.width * 0.67,
            clientY: box.y + box.height * 0.42,
          });
          await product.waitForFunction(() => {
            const actions = document.querySelector('.navmap__actions');
            return actions && !actions.hidden && getComputedStyle(actions).display !== 'none';
          });
          await product.locator('[data-map-action="waypoint"]').click();
          await product.waitForFunction(() => {
            const map = document.querySelector('.navmap');
            return map?.hidden === true && getComputedStyle(map).display === 'none';
          });
          await product.waitForFunction(() => {
            const distance = document.querySelector('.navmap-mini__distance');
            return distance && !distance.hidden && distance.textContent?.startsWith('WAYPOINT · ');
          });
          await product.waitForTimeout(250);
          const miniWithWaypoint = await signature(mini);
          assert.notEqual(miniWithWaypoint, miniBeforeWaypoint, 'Waypoint erscheint nicht auf der Minimap');

          await product.keyboard.press('m');
          await product.waitForFunction(() => document.querySelector('.navmap')?.hidden === false);
          const box2 = await full.boundingBox();
          assert.ok(box2, 'Karten-Canvas fehlt beim zweiten Öffnen');
          await full.dispatchEvent('pointerup', {
            button: 0,
            pointerId: 12,
            pointerType: 'touch',
            clientX: box2.x + box2.width * 0.20,
            clientY: box2.y + box2.height * 0.78,
          });
          await product.locator('[data-map-action="teleport"]').click();
          await product.waitForFunction(() => {
            const map = document.querySelector('.navmap');
            return map?.hidden === true && getComputedStyle(map).display === 'none';
          });
          await product.waitForTimeout(300);
          const miniAfterTeleport = await signature(mini);
          assert.notEqual(miniAfterTeleport, miniWithWaypoint, 'Teleport verändert die Kartenposition nicht');
          await productContext.close();

          // Dev: 3D-Weltmarker und tatsächliche Fahrzeugbewegung direkt verifizieren.
          const dev = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          await dev.goto('http://127.0.0.1:4179/', { waitUntil: 'domcontentloaded' });
          await dev.waitForFunction(() => (
            Boolean(window.japanMap?.engine?.systems?.some((system) => system.name === 'DriveSystem')) &&
            Boolean(document.querySelector('.navmap__canvas'))
          ), null, { timeout });
          const mechanics = await dev.evaluate(async () => {
            const engine = window.japanMap.engine;
            const drive = engine.systems.find((system) => system.name === 'DriveSystem');
            if (!drive) throw new Error('DriveSystem fehlt');
            drive.enter();

            const choose = (nx, ny, action) => {
              window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyM', key: 'm', bubbles: true }));
              const canvas = document.querySelector('.navmap__canvas');
              if (!canvas) throw new Error('Navigation canvas fehlt');
              const rect = canvas.getBoundingClientRect();
              canvas.dispatchEvent(new PointerEvent('pointerup', {
                button: 0,
                pointerId: 21,
                pointerType: 'touch',
                clientX: rect.left + rect.width * nx,
                clientY: rect.top + rect.height * ny,
                bubbles: true,
                cancelable: true,
              }));
              document.querySelector(`[data-map-action="${action}"]`).click();
            };

            choose(0.72, 0.34, 'waypoint');
            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            const beam = engine.scene.getObjectByName('Waypoint:Beam');
            const core = engine.scene.getObjectByName('Waypoint:Core');
            const ring = engine.scene.getObjectByName('Waypoint:Ring');
            const label = engine.scene.getObjectByName('Waypoint:Label');
            const group = engine.scene.getObjectByName('Waypoint');
            const markerVisible = Boolean(
              group?.visible && beam?.visible && core?.visible && ring?.visible && label?.visible,
            );
            const labelScaled = Boolean(label && label.scale.x > 10 && label.scale.y > 2);
            const mapClosedAfterWaypoint = document.querySelector('.navmap')?.hidden === true;

            const before = { x: drive.vehicle.position.x, z: drive.vehicle.position.z };
            choose(0.16, 0.82, 'teleport');
            const after = { x: drive.vehicle.position.x, z: drive.vehicle.position.z };
            const mapClosedAfterTeleport = document.querySelector('.navmap')?.hidden === true;
            return {
              markerVisible,
              labelScaled,
              mapClosedAfterWaypoint,
              mapClosedAfterTeleport,
              distance: Math.hypot(after.x - before.x, after.z - before.z),
            };
          });
          assert.equal(mechanics.markerVisible, true, 'Beam/Core/Ring/Text des Weltmarkers sind nicht sichtbar');
          assert.equal(mechanics.labelScaled, true, 'Waypoint-Text ist in der Welt nicht sinnvoll skaliert');
          assert.equal(mechanics.mapClosedAfterWaypoint, true, 'Karte schließt nach Waypoint nicht');
          assert.equal(mechanics.mapClosedAfterTeleport, true, 'Karte schließt nach Teleport nicht');
          assert.ok(mechanics.distance > 100, `Teleport bewegt nur ${mechanics.distance.toFixed(1)} m`);

          await browser.close();
          console.log('aerial navigation UI + waypoint mechanics: ok');
          EOF
          node .navigation-ui.mjs
          rm .navigation-ui.mjs
