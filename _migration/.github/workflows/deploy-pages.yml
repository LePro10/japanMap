# Veröffentlicht den alten Three.js-Prototyp (legacy/threejs) weiter auf
# GitHub Pages, bis das Unity-Spiel ihn ersetzt. Läuft nur, wenn sich im
# Legacy-Ordner etwas ändert — Unity-Commits lösen keinen Deploy aus.
name: Deploy legacy prototype to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['legacy/threejs/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: legacy/threejs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legacy/threejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy/threejs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
