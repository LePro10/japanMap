<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preload" href="TemplateData/display.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* CrazyGames: the game fills its frame, nothing selectable, no long-press menu, no page scroll (D37). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120e1e;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none;
        background: #120e1e; }
      /* Covers the whole frame until something playable stands (the title, D48): nothing half-built shows through.
         "Night Meet" (D55): night violet, washi-white type, momo pink for progress, one shu hanko. The name in Archivo
         Condensed Black Italic (TemplateData/display.woff2, cut to capitals and digits: ArtSource/web/loader_assets.py);
         the Japanese words are SVG paths — no CJK font in the start download. A real progress bar (Unity's files, then
         the game's boot stages from PageBridge.cs) with the stage in words, and one tip at a time. */
      @font-face { font-family: "JMDisplay"; src: url("TemplateData/display.woff2") format("woff2"); font-display: block; }
      #loading { position: fixed; inset: 0; z-index: 2; overflow: hidden; color: #f5efe4; text-align: left;
        background: radial-gradient(120% 90% at 30% 38%, #2a1d40 0%, #1e1830 38%, #120e1e 78%) #120e1e;
        font-family: "JMDisplay", system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .5s ease-out; }
      #loading.done { opacity: 0; pointer-events: none; }
      /* Manga speed lines from behind the name, faded out before the edges. */
      #loading .speed { position: absolute; left: 34%; top: 38%; width: 240vmax; height: 240vmax; transform: translate(-50%, -50%);
        background: repeating-conic-gradient(from 0deg, rgba(245,239,228,.07) 0deg .5deg, rgba(245,239,228,0) .5deg 4.5deg);
        -webkit-mask: radial-gradient(circle, transparent 9%, #000 18%, transparent 40%); mask: radial-gradient(circle, transparent 9%, #000 18%, transparent 40%);
        animation: jmspin 60s linear infinite; }
      @keyframes jmspin { to { transform: translate(-50%, -50%) rotate(360deg); } }
      #loading .rain { position: absolute; inset: -20% 0 0 0; pointer-events: none; opacity: .18;
        background-image: repeating-linear-gradient(100deg, rgba(196,186,255,0) 0 22px, rgba(196,186,255,.4) 22px 23px, rgba(196,186,255,0) 23px 61px);
        background-size: 240px 240px; animation: jmrain .6s linear infinite; }
      @keyframes jmrain { from { background-position: 0 0; } to { background-position: -42px 240px; } }
      /* Light trails: pink and sora streaks across the lower half, like cars passing a night meet. */
      #loading .streak { position: absolute; height: 2px; width: 34vw; left: -40vw; opacity: .85; transform: skewX(-24deg);
        background: linear-gradient(90deg, rgba(255,46,122,0), #ff2e7a); box-shadow: 0 0 12px rgba(255,46,122,.7);
        animation: jmstreak 2.8s cubic-bezier(.5,0,.3,1) infinite; }
      #loading .streak.s1 { top: 63%; }
      #loading .streak.s2 { top: 72%; width: 22vw; animation-duration: 3.4s; animation-delay: .9s;
        background: linear-gradient(90deg, rgba(140,151,255,0), #8c97ff); box-shadow: 0 0 12px rgba(140,151,255,.7); }
      #loading .streak.s3 { top: 86%; height: 3px; width: 44vw; animation-duration: 2.2s; animation-delay: 1.6s; }
      @keyframes jmstreak { from { transform: translateX(0) skewX(-24deg); } to { transform: translateX(160vw) skewX(-24deg); } }
      /* 雨上がり, upright and huge on the right: pink outline only, behind everything. */
      #loading .tate { position: absolute; right: 5vw; top: 50%; height: min(84vh, 150vw); transform: translateY(-50%); overflow: visible;
        opacity: 0; animation: jmfade 1.2s ease-out .3s forwards; }
      #loading .tate path { fill: none; stroke: #ff2e7a; stroke-width: 1.4px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
      /* The name: letters rise in one after another, the hanko presses in after them. */
      #loading .brand { position: absolute; left: 8vw; right: 8vw; top: 18%; }
      #loading .line1 { display: flex; align-items: center; gap: clamp(10px, 1.6vw, 22px); }
      #loading .name { font-weight: 900; font-style: italic; font-size: clamp(54px, 11vw, 148px); line-height: .9; letter-spacing: -.01em;
        text-shadow: 0 6px 30px rgba(0,0,0,.55); white-space: nowrap; }
      #loading .name span { display: inline-block; opacity: 0; transform: translateY(.35em) skewX(-6deg); animation: jmrise .7s cubic-bezier(.2,1.4,.4,1) forwards; }
      #loading .hanko { flex: none; width: clamp(48px, 7.4vw, 96px); height: clamp(48px, 7.4vw, 96px); opacity: 0; transform: rotate(-12deg) scale(1.7);
        animation: jmstamp .26s cubic-bezier(.3,1.6,.5,1) .95s forwards; }
      #loading .hanko .ring { fill: none; stroke: #e8402a; }
      #loading .hanko path { fill: #e8402a; }
      @keyframes jmstamp { to { opacity: .95; transform: rotate(-12deg) scale(1); } }
      /* The second word on a slanted pink band, the tagline beside it. */
      #loading .second { display: flex; align-items: center; gap: 18px; margin-top: clamp(10px, 1.6vw, 20px); opacity: 0; animation: jmslide .5s cubic-bezier(.2,1,.3,1) .7s forwards; }
      #loading .second span { display: inline-block; padding: .08em .7em .12em .5em; background: #ff2e7a; color: #120e1e; transform: skewX(-14deg);
        font-weight: 900; font-style: italic; font-size: clamp(22px, 3.6vw, 46px); line-height: 1; letter-spacing: .14em; }
      #loading .sub { font: 600 clamp(10px, 1.15vw, 13px)/1.3 system-ui, sans-serif; letter-spacing: .3em; color: #a49cb8; }
      @keyframes jmrise { to { opacity: 1; transform: translateY(0) skewX(-6deg); } }
      @keyframes jmfade { to { opacity: 1; } }
      @keyframes jmslide { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
      /* Progress: a slanted pink bar on a dim track, the stage in words, the percentage big and italic. */
      #loading .foot { position: absolute; left: 8vw; bottom: max(8vh, 36px); width: min(84vw, 560px); }
      #loading .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
      #loading .stage { font-weight: 900; font-style: italic; font-size: clamp(13px, 1.5vw, 17px); letter-spacing: .16em; text-transform: uppercase; color: #f5efe4; }
      #loading .pct { font-weight: 900; font-style: italic; font-size: clamp(28px, 3.6vw, 44px); line-height: .8; color: #ff2e7a; font-variant-numeric: tabular-nums; }
      #loading .meter { position: relative; height: 10px; transform: skewX(-24deg); background: rgba(245,239,228,.12); }
      #loading .fill { height: 100%; width: 0; background: #ff2e7a; box-shadow: 0 0 16px rgba(255,46,122,.55); transition: width .3s ease-out; }
      #loading .head { position: absolute; top: -4px; bottom: -4px; left: 0; width: 4px; margin-left: -2px; background: #f5efe4; transition: left .3s ease-out; }
      #loading .tip { margin-top: 18px; min-height: 2.8em; font: 500 clamp(12px, 1.4vw, 15px)/1.4 system-ui, sans-serif; color: #e4dcef; transition: opacity .35s, transform .35s; }
      /* Key-cap look of the game's hints: paper on ink. */
      #loading .tip b { display: inline-block; margin-right: 10px; padding: 3px 7px 2px; border-radius: 3px; background: #f5efe4; color: #17121f;
        font: italic 900 11px/1.2 "JMDisplay", system-ui, sans-serif; letter-spacing: .14em; vertical-align: 1px; }
      #loading .tip.out { opacity: 0; transform: translateY(6px); }
      /* Phones upright: the upright word under the name (beside it, it ran through the name). */
      @media (max-aspect-ratio: 3/4) {
        #loading .brand { top: 16%; left: 7vw; }
        #loading .name { font-size: 15vw; }
        #loading .tate { right: 6vw; top: 34%; height: 44vh; transform: none; }
        #loading .second { flex-direction: column; align-items: flex-start; gap: 12px; }
        #loading .foot { left: 7vw; width: 86vw; }
      }
      /* Phones on their side (≈390 px high): name at the top, the foot below. */
      @media (max-height: 480px) {
        #loading .brand { top: 9%; }
        #loading .name { font-size: min(17vh, 11vw); }
        #loading .second span { font-size: min(6.5vh, 3.6vw); }
        #loading .sub { display: none; }
        #loading .foot { bottom: 18px; }
        #loading .tip { margin-top: 10px; min-height: 1.4em; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .rain, #loading .speed, #loading .streak { animation: none; }
        #loading .streak { display: none; }
        #loading .name span, #loading .second, #loading .hanko, #loading .tate { animation-duration: .01s; animation-delay: 0s; }
      }
      #message { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw; padding: 10px 14px;
        border-radius: 8px; background: #2a1420; color: #ffd7e4; font: 14px/1.4 system-ui, sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading" data-name="{{{ PRODUCT_NAME.toUpperCase() }}}">
      <div class="speed"></div><div class="rain"></div>
      <svg class="tate" viewBox="-20 -20 1040 4040" aria-hidden="true"><path transform="translate(0 0)" d="M958 299H604V320H953V710Q953 783 938 816Q923 849 870 864Q817 878 698 879Q694 835 686 804Q678 772 660 738Q640 729 604 716V871H398V752L386 772Q332 737 252 715V871H52V320H398V299H32V131H958ZM252 544 287 466H252ZM398 466H315Q363 486 398 505ZM604 537 636 466H604ZM753 466H664Q725 493 753 508ZM280 605Q340 624 398 653V604L386 623Q356 605 326 593Q297 581 252 565V666ZM604 659 628 605Q703 633 753 660V593L734 623Q706 605 676 593Q647 581 604 566ZM722 731Q740 731 746 728Q753 726 753 719V680Z"/><path transform="translate(0 1000)" d="M595 466V657H950V872H50V657H344V121H595V259H935V466Z"/><path transform="translate(0 2000)" d="M760 742Q755 602 740 497Q725 392 693 279L663 286Q688 311 698 355Q707 399 707 472Q707 603 703 668Q699 732 688 766Q676 800 652 826Q626 854 557 870Q488 885 361 892Q345 782 320 721Q298 789 261 882Q135 837 1 812Q65 716 101 632Q137 547 154 445L31 457Q33 345 4 246Q112 242 172 241Q173 202 173 117H419Q417 166 411 235H442Q509 235 554 240Q598 246 627 260Q604 200 572 148L664 124Q681 151 694 178L725 175Q702 131 693 117L785 93Q811 133 826 168L895 163Q940 316 960 424Q980 532 995 709ZM488 515Q488 474 484 457Q479 440 466 434Q452 429 419 429Q400 429 388 430Q367 560 337 662Q380 667 405 667Q449 667 460 657Q473 647 480 610Q488 573 488 515Z"/><path transform="translate(0 3000)" d="M934 472Q934 600 858 692Q783 783 638 832Q494 880 291 880Q274 825 231 776Q188 727 111 672Q307 668 428 646Q549 623 606 579Q662 535 662 465Q662 405 624 371Q585 337 517 337Q497 337 476 340Q404 350 362 397Q320 444 320 513Q320 543 329 576L65 608Q58 541 58 456Q58 292 87 129L343 115Q338 140 335 165Q332 190 329 229Q378 189 444 168Q509 147 583 147Q686 147 766 188Q846 229 890 302Q934 376 934 472Z"/></svg>
      <div class="streak s1"></div><div class="streak s2"></div><div class="streak s3"></div>
      <div class="brand"><div class="line1"><div class="name"></div>
          <svg class="hanko" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring" cx="50" cy="50" r="46" stroke-width="5"/><circle class="ring" cx="50" cy="50" r="37.5" stroke-width="2"/><path transform="translate(23 23) scale(.054)" d="M958 299H604V320H953V710Q953 783 938 816Q923 849 870 864Q817 878 698 879Q694 835 686 804Q678 772 660 738Q640 729 604 716V871H398V752L386 772Q332 737 252 715V871H52V320H398V299H32V131H958ZM252 544 287 466H252ZM398 466H315Q363 486 398 505ZM604 537 636 466H604ZM753 466H664Q725 493 753 508ZM280 605Q340 624 398 653V604L386 623Q356 605 326 593Q297 581 252 565V666ZM604 659 628 605Q703 633 753 660V593L734 623Q706 605 676 593Q647 581 604 566ZM722 731Q740 731 746 728Q753 726 753 719V680Z"/></svg></div>
        <div class="second"><span></span><div class="sub">BLUE HOUR AFTER THE RAIN</div></div></div>
      <div class="foot"><div class="row"><span class="stage">Downloading</span><span class="pct">0 %</span></div>
        <div class="meter"><div class="fill"></div><div class="head"></div></div><div class="tip"></div></div>
    </div>
    <div id="message"></div>
    <script>
      // A refused pointer lock (page without focus, frame without permission, a click during load) is not an error:
      // the game runs on and the next click asks again. Registered before Unity's loader so its error dialog never
      // sees it (Phase 8 and 10: "not valid for pointer lock" became a full error dialog).
      function benignLock(reason) { return /pointer ?lock/i.test(String(reason && (reason.message || reason))); }
      window.addEventListener('unhandledrejection', function (e) { if (benignLock(e.reason)) { e.preventDefault(); e.stopImmediatePropagation(); console.warn('[Page] pointer lock refused'); } });
      window.addEventListener('error', function (e) { if (benignLock(e.error || e.message)) { e.preventDefault(); e.stopImmediatePropagation(); console.warn('[Page] pointer lock refused'); } });
      // An SDK script the browser refused (ad blocker): the game reads this (JapanMapSdk.jslib) and starts at once
      // instead of waiting out the SDK timeout on a black screen (6 s, Phase 11). Resource errors only reach a
      // capturing listener.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && /sdk\.crazygames\.com/.test(t.src)) { window.__jmSdkFailed = true; console.warn('[Page] CrazyGames SDK script blocked'); }
      }, true);
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Pixel ratio (CrazyGames requirement): 1 on iOS and on phones with 4 GB or less, at most 2 elsewhere.
      // ?dpr=<n> overrides it for tests.
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var phone = ios || /Android|Mobile/.test(ua);
      var lowMemory = navigator.deviceMemory !== undefined && navigator.deviceMemory <= 4;
      var dpr = (ios || (phone && lowMemory)) ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      var forced = new URLSearchParams(location.search).get('dpr');
      if (forced) dpr = parseFloat(forced);

      // The name letter by letter (first word), the second word on the pink band — like the game's title.
      var loadingEl = document.getElementById('loading');
      var words = (loadingEl.getAttribute('data-name') || '').split(' ');
      var nameEl = loadingEl.querySelector('.name');
      words[0].split('').forEach(function (ch, i) { var sp = document.createElement('span'); sp.textContent = ch; sp.style.animationDelay = (0.1 + 0.05 * i) + 's'; nameEl.appendChild(sp); });
      loadingEl.querySelector('.second span').textContent = words.slice(1).join(' ');
      if (words.length < 2) loadingEl.querySelector('.second').style.display = 'none';

      var fill = loadingEl.querySelector('.fill'), head = loadingEl.querySelector('.head');
      var stageEl = loadingEl.querySelector('.stage'), pctEl = loadingEl.querySelector('.pct');
      var shown = 0, stage = 'Downloading';
      // Never backwards; Unity's files are the first 70 %, the game's boot stages (PageBridge.cs) the rest.
      function setProgress(p, text) {
        shown = Math.max(shown, Math.min(100, p));
        fill.style.width = shown + '%'; head.style.left = shown + '%';
        pctEl.textContent = Math.floor(shown) + ' %';
        if (text) { stage = text; stageEl.textContent = text; }
      }
      window.__jmProgress = function (share, text) { setProgress(70 + 29 * share, text); };
      // One line at a time while loading: the controls players ask for first.
      var tips = ['Shift — nitro. Hit a ramp fast.', 'Shift twice — burst the whole tank at once.', 'Space — handbrake drift. Chain drifts for Sparks.',
        'Spend Sparks at the Open Bay: tune and paint your car.', 'Double-tap Space in the air for a barrel roll.',
        'M — map and fast travel. P — photo mode.', 'Come back tomorrow: daily bonus and a new challenge.'];
      var tipEl = loadingEl.querySelector('.tip'), tipAt = Math.floor(Math.random() * tips.length);
      function nextTip() { tipEl.classList.add('out'); setTimeout(function () { tipEl.innerHTML = '<b>TIP</b>' + tips[tipAt++ % tips.length]; tipEl.classList.remove('out'); }, 350); }
      nextTip();
      var tipTimer = setInterval(nextTip, 3600);
      function show(text) { var m = document.getElementById('message'); m.textContent = text; m.style.display = 'block'; }
      createUnityInstance(document.querySelector('#unity-canvas'), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: dpr,
        // Errors as a quiet note in the page, never alert(): a modal dialog in the portal frame stops everything.
        showBanner: function (msg, type) { if (type === 'error') show(msg); else console.warn(msg); },
      }, function (progress) {
        // Unity's own files: the first 70 % (the rest is the world and the car: StreamedTerrain, CarModels).
        setProgress(70 * progress, progress < 1 ? 'Downloading' : 'Starting the engine');
      }).then(function (instance) {
        // The loading screen stays until something playable stands (PageBridge: the title, or the first gameplayStart):
        // it went with Unity's files once, and players saw black, then a grey box for a car (human, 2026-10-11).
        var crawl = setInterval(function () { setProgress(shown + (99 - shown) * 0.02); }, 250); // a slow line never looks stuck
        window.__jmLoaded = function () {
          clearInterval(crawl); clearInterval(tipTimer); setProgress(100, 'Ready');
          // A soft fade into the title (same face, same night) instead of a cut.
          setTimeout(function () { loadingEl.classList.add('done'); }, 120);
          setTimeout(function () { loadingEl.style.display = 'none'; }, 700);
        };
        setTimeout(window.__jmLoaded, 45000); // never a loading screen forever
        window.unityInstance = instance; // tools read GetMetricsInfo() (memory)
      }).catch(function (message) {
        show(String(message));
      });
    </script>
  </body>
</html>
