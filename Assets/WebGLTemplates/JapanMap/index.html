<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* CrazyGames: the game fills its frame, nothing selectable, no long-press menu, no page scroll (D37). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1422;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none;
        background: #0d1422; }
      /* Covers the whole frame until the game is playable: nothing half-built shows through (2026-10-11).
         Same face and palette as the game (Saira Condensed, ink + amber, Game.uss) and a little rain: the first
         seconds belong to the mood, not to a progress bar (2026-10-13). */
      @font-face { font-family: "JMDisplay"; src: url("TemplateData/display.ttf") format("truetype"); font-display: swap; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 120%, #2b3a63 0%, #101a30 45%, #06141a 80%); z-index: 2; overflow: hidden;
        font: 700 clamp(30px, 7vw, 64px)/1 "JMDisplay", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f6efe4;
        letter-spacing: .12em; text-align: center; }
      #loading .jp { font: 500 clamp(12px, 1.6vw, 16px)/1 system-ui, sans-serif; letter-spacing: .6em; color: #e8ba7f; margin-bottom: 14px; opacity: .85; }
      #loading .sub { margin-top: 12px; font: 600 clamp(11px, 1.3vw, 13px)/1 system-ui, sans-serif; letter-spacing: .32em; color: #b7c4c8; }
      #loading .bar { width: min(60vw, 380px); margin-top: 28px; height: 3px; border-radius: 2px; background: rgba(246,239,228,.12); overflow: hidden; }
      #loading .fill { height: 100%; width: 0; background: linear-gradient(90deg, #e8ba7f, #f3c56a); transition: width .25s; box-shadow: 0 0 12px #f3c56a; }
      #loading .tip { margin-top: 18px; min-height: 1.4em; font: 500 clamp(12px, 1.4vw, 15px)/1.4 system-ui, sans-serif; letter-spacing: .04em; color: #b7c4c8; transition: opacity .4s; }
      #loading .rain { position: absolute; inset: -20% 0 0 0; pointer-events: none; opacity: .35;
        background-image: repeating-linear-gradient(100deg, rgba(180,200,255,.0) 0 22px, rgba(180,200,255,.35) 22px 23px, rgba(180,200,255,0) 23px 61px);
        background-size: 240px 240px; animation: jmrain .6s linear infinite; }
      @keyframes jmrain { from { background-position: 0 0; } to { background-position: -42px 240px; } }
      @media (prefers-reduced-motion: reduce) { #loading .rain { animation: none; } }
      #message { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw; padding: 10px 14px;
        border-radius: 8px; background: #2a1620; color: #ffd7d7; font: 14px/1.4 system-ui, sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div class="rain"></div><div class="jp">雨上がり</div>{{{ PRODUCT_NAME.toUpperCase() }}}<div class="sub">BLUE HOUR AFTER THE RAIN</div><div class="bar"><div class="fill"></div></div><div class="tip"></div></div>
    <div id="message"></div>
    <script>
      // A refused pointer lock (page without focus, frame without permission, a click during load) is not an error:
      // the game runs on and the next click asks again. Registered before Unity's loader so its error dialog never
      // sees it (Phase 8 and 10: "not valid for pointer lock" became a full error dialog).
      function benignLock(reason) { return /pointer ?lock/i.test(String(reason && (reason.message || reason))); }
      window.addEventListener('unhandledrejection', function (e) { if (benignLock(e.reason)) { e.preventDefault(); e.stopImmediatePropagation(); console.warn('[Page] pointer lock refused'); } });
      window.addEventListener('error', function (e) { if (benignLock(e.error || e.message)) { e.preventDefault(); e.stopImmediatePropagation(); console.warn('[Page] pointer lock refused'); } });
      // An SDK script the browser refused (ad blocker): the game reads this (JapanMapSdk.jslib) and starts at once
      // instead of waiting out the SDK timeout on a black screen (6 s, Phase 11). Resource errors only reach a
      // capturing listener.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && /sdk\.crazygames\.com/.test(t.src)) { window.__jmSdkFailed = true; console.warn('[Page] CrazyGames SDK script blocked'); }
      }, true);
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Pixel ratio (CrazyGames requirement): 1 on iOS and on phones with 4 GB or less, at most 2 elsewhere.
      // ?dpr=<n> overrides it for tests.
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var phone = ios || /Android|Mobile/.test(ua);
      var lowMemory = navigator.deviceMemory !== undefined && navigator.deviceMemory <= 4;
      var dpr = (ios || (phone && lowMemory)) ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      var forced = new URLSearchParams(location.search).get('dpr');
      if (forced) dpr = parseFloat(forced);

      var fill = document.querySelector('#loading .fill');
      // One line at a time while loading: the controls players ask for first.
      var tips = ['Shift — nitro. Hit a ramp fast.', 'Space — handbrake drift. Chain drifts for Sparks.', 'Spend Sparks at the Open Bay: tune and paint your car.',
        'Double-tap Space in the air for a barrel roll.', 'M — map and fast travel. P — photo mode.', 'Come back tomorrow: daily bonus and a new challenge.'];
      var tipEl = document.querySelector('#loading .tip'), tipAt = Math.floor(Math.random() * tips.length);
      function nextTip() { tipEl.style.opacity = 0; setTimeout(function () { tipEl.textContent = tips[tipAt++ % tips.length]; tipEl.style.opacity = 1; }, 400); }
      nextTip();
      var tipTimer = setInterval(nextTip, 3200);
      function show(text) { var m = document.getElementById('message'); m.textContent = text; m.style.display = 'block'; }
      createUnityInstance(document.querySelector('#unity-canvas'), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: dpr,
        // Errors as a quiet note in the page, never alert(): a modal dialog in the portal frame stops everything.
        showBanner: function (msg, type) { if (type === 'error') show(msg); else console.warn(msg); },
      }, function (progress) {
        // Unity's own files are 85 % of the bar; the rest is the world and the car (StreamedTerrain, CarModels).
        fill.style.width = (85 * progress) + '%';
      }).then(function (instance) {
        // The loading screen stays until the game is playable (JapanMapLoaded at the first gameplayStart): it went
        // with Unity's files before, and players saw black, then a grey box for a car (human, 2026-10-11).
        var loading = document.getElementById('loading');
        var crawl = setInterval(function () {
          var w = parseFloat(fill.style.width) || 85;
          fill.style.width = Math.min(99, w + (99 - w) * 0.06) + '%';
        }, 200);
        window.__jmLoaded = function () { clearInterval(crawl); clearInterval(tipTimer); fill.style.width = '100%'; setTimeout(function () { loading.style.display = 'none'; }, 150); };
        setTimeout(window.__jmLoaded, 45000); // never a loading screen forever
        window.unityInstance = instance; // tools read GetMetricsInfo() (memory)
      }).catch(function (message) {
        show(String(message));
      });
    </script>
  </body>
</html>
